services:
  # Frontend Next.js
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Token de acesso pessoal do GitHub (opcional, apenas para repositórios privados)
        # Configure via variável de ambiente GITHUB_TOKEN ou no arquivo .env
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Configure a URL da API do backend aqui
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3333}
    networks:
      - fenix
    restart: unless-stopped

networks:
  fenix:
    driver: bridge
